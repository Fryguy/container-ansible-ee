version: 3
images:
  base_image:
    name: registry.access.redhat.com/ubi10/ubi:latest
dependencies:
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  python:
  - pywinrm
  - aiobotocore>=3.9.0 # Set a higher minimum to avoid excessive backtracking for aws packages
  - boto3==1.43.56 # Pin to avoid excessive backtracking for aws packages
  system:
  - python3-devel [compile] # For compiling ovirt-engine-sdk-python
  galaxy:
    roles:
    - manageiq.manageiq_automate
    - manageiq.manageiq_vmdb
    collections:
    - amazon.aws
    - ansible.netcommon
    - ansible.utils
    - awx.awx
    - azure.azcollection
    - cisco.intersight
    - community.aws
    - community.okd
    - community.vmware
    - google.cloud
    - kubernetes.core
    - openstack.cloud
    - ovirt.ovirt
    - theforeman.foreman
  exclude:
    system:
    - qemu-img # from collection ovirt.ovirt - not available in ubi10
additional_build_steps:
  append_final:
  # Create a writable home directory for arbitrary UIDs (e.g. Kubernetes/OpenShift)
  - RUN mkdir -p /home/runner/.ansible/tmp && chgrp -R 0 /home/runner && chmod -R ug+rwx /home/runner
  - ENV HOME=/home/runner
  # Remove __pycache__
  - RUN find / -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true
  # Remove unnecessary large files
  - RUN rm -f /usr/share/ansible/collections/ansible_collections/cisco/intersight/misc/*
  - RUN rm -f /usr/local/lib/python3.12/site-packages/msgraph/generated/kiota-dom-export.txt # https://github.com/microsoftgraph/msgraph-sdk-python/issues/1287
